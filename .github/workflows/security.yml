name: security

# Continuous secret + SAST + dependency scans for quillAgent.
#
# This is the GitHub-side complement to the local nightly launchd job
# (`quillServer/scripts/security/quill-scan-local.sh`, Phase B Tier 1
# B1.2/B1.3/B1.4). CI catches what the local job misses: PRs from a
# clean clone, pushes from another machine, and the very first push of
# a new branch.
#
# Security jobs run on every trigger; builds verify locked dependency updates.
#   - gitleaks      on every push and PR (fast; consumes baseline)
#   - osv-scanner   on pushes, PRs, manual runs and the daily schedule
#   - semgrep       on pushes, PRs, manual runs and the daily schedule

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read
  # gitleaks-action@v2 needs PR access to list commits and post comments.
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Build shared contracts before consumers
        run: |
          npm run build -w shared
          npm run build -w backend
          npm run build -w quill-agent

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository (full history for git-history scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          # gitleaks-action@v2 requires GITHUB_TOKEN to scan PRs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_BASELINE_PATH: .gitleaks/baseline.json

  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Install osv-scanner from the upstream release binary.
      # The root lockfile covers all three npm workspaces, including dev and
      # optional dependencies. Select it explicitly so traversal cannot skip it.
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.3.5/osv-scanner_linux_amd64 \
            -o osv-scanner
          echo "bb30c580afe5e757d3e959f4afd08a4795ea505ef84c46962b9a738aa573b41b  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner
          ./osv-scanner --version

      - name: Run osv-scanner (report all; fail only on High/Critical)
        # osv-scanner exits non-zero on ANY advisory regardless of severity,
        # which made the daily schedule fail on low-severity, often dev-only
        # advisories (e.g. newly-published GHSAs against build tooling). We
        # scan once to JSON, print every finding for visibility, then fail
        # the job only on High/Critical: CVSS base score >= 7.0 OR a GHSA
        # "HIGH"/"CRITICAL" label (covers advisories with no CVSS vector).
        # Scan the single workspace lockfile; retain the full advisory report.
        run: |
          set -uo pipefail
          # Actions invokes bash with -e; keep the scanner in an OR-list so
          # exit 1 reaches the explicit severity gate below.
          rc=0
          ./osv-scanner scan source --lockfile "$PWD/package-lock.json" --format json --output-file osv-results.json || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::osv-scanner failed to run (exit $rc)"
            exit "$rc"
          fi
          if [ ! -s osv-results.json ]; then
            echo "::error::osv-scanner produced no output"
            exit 1
          fi
          echo "----- advisories found (any severity) -----"
          jq -r '.results[].packages[]
                 | .package.name as $n | .package.version as $v
                 | (.groups[]? | "\($n)@\($v)  CVSS=\(.max_severity // "n/a")  \(.ids | join(","))")' \
            osv-results.json || true
          echo "-------------------------------------------"
          high=$(jq '
            ([ .results[].packages[].groups[]?.max_severity
               | select(. != null and . != "") | tonumber | select(. >= 7.0) ] | length)
            + ([ .results[].packages[].vulnerabilities[]?.database_specific.severity
                 | select(. != null) | ascii_upcase | select(. == "HIGH" or . == "CRITICAL") ] | length)
          ' osv-results.json)
          if ! printf '%s' "$high" | grep -qE '^[0-9]+$'; then
            echo "::error::failed to evaluate osv-scanner severity gate"
            exit 1
          fi
          echo "High/Critical findings: $high"
          if [ "$high" -gt 0 ]; then
            echo "::error::osv-scanner found High/Critical vulnerabilities (see list above)"
            exit 1
          fi
          echo "No High/Critical advisories; lower-severity findings (if any) are non-blocking."

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run semgrep CI
        # Findings fail every scan, including the daily schedule. Reviewed
        # intentional behaviors carry exact-rule annotations at their sources.
        run: semgrep ci --config=auto
